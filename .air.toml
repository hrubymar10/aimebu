# Live reload for `make dev`: rebuild and restart on source changes.
root = "."
tmp_dir = "tmp"

[build]
  # The version the page header shows: the checkout's `git describe`, as bin/aimebu builds it (plain "go build" keeps the default).
  cmd = "go build -ldflags \"-X 'main.version=aimebu $(git describe --tags --always --dirty 2>/dev/null || echo dev)'\" -o ./tmp/aimebu ./cmd/aimebu"
  bin = "tmp/aimebu"
  full_bin = "sh scripts/dev-run.sh ./tmp/aimebu"
  include_ext = ["go", "html", "css", "js", "mjs", "json"]
  exclude_dir = ["tmp", "node_modules", "docs"]
  delay = 1000
  kill_delay = "45s"
  send_interrupt = true
  stop_on_error = false

[log]
  time = true
