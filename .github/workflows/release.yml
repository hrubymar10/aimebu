name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build archives and checksums
        run: bash scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: Verify archives and standalone server
        run: |
          node scripts/test-release-build.cjs "$GITHUB_REF_NAME" --verify-only
          node scripts/test-standalone.cjs dist/aimebu
      - name: Create release if needed and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            case "$GITHUB_REF_NAME" in
              *-alpha.*|*-beta.*) gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --generate-notes ;;
              *) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ;;
            esac
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber

  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo 'HOMEBREW_TAP_TOKEN is absent; skipping tap update.'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.available == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Render and publish tap formula
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --pattern 'aimebu_*.tar.gz' --pattern checksums.txt --dir dist
          node scripts/render-homebrew.cjs "$GITHUB_REF_NAME" /tmp/aimebu.rb
          ruby -c /tmp/aimebu.rb
          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          gh auth setup-git
          git clone https://github.com/hrubymar10/homebrew-tap.git /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/aimebu.rb /tmp/homebrew-tap/Formula/aimebu.rb
          git -C /tmp/homebrew-tap add Formula/aimebu.rb
          if ! git -C /tmp/homebrew-tap diff --cached --quiet; then
            git -C /tmp/homebrew-tap -c user.name='aimebu release' -c user.email='actions@users.noreply.github.com' commit -m "chore(aimebu): update to $GITHUB_REF_NAME"
            git -C /tmp/homebrew-tap push origin HEAD
          fi
